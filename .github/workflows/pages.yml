name: Pages

# Publishes the static site to GitHub Pages on every push to main.
# No build step: the repository root is the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          # Every page, not a list someone has to remember to extend: impressum.html
          # was added later and never reached the published site, so the Impressum
          # link in the footer – the one page German law requires – answered 404.
          cp *.html *.css *.js robots.txt .nojekyll _site/
          cp -r assets _site/
          # CNAME is how a custom domain reaches a workflow-published site. It is
          # absent until the apex moves, so this must not fail the build.
          [ -f CNAME ] && cp CNAME _site/ || true
      - name: Check the pages that must exist
        run: |
          for f in index.html impressum.html 404.html styles.css kiosk.js; do
            test -s "_site/$f" || { echo "missing from the published site: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
