name: Pages

# Publishes the static site to GitHub Pages on every push to main.
# No build step: the repository root is the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to date each page from its own last commit, below.
          fetch-depth: 0
      - name: Collect the site
        run: |
          # Publish everything except what is repository furniture. This used to
          # be an allow-list and it failed twice the same way: impressum.html was
          # added and never published, so the one page German law requires
          # answered 404 (6 November); then sitemap.xml and llms.txt were added
          # and did the same (20 November), because the list had been widened to
          # globs for .html, .css and .js but still named every other file.
          #
          # A deny-list cannot fail that way: a new file ships unless someone
          # says it should not.
          mkdir _site
          rsync -a             --exclude='.git'             --exclude='.github'             --exclude='_site'             --exclude='docs'             --exclude='README.md'             ./ _site/
      - name: Date the sitemap from the pages themselves
        run: |
          # lastmod was written by hand once and went stale immediately: it
          # still claimed 10 November for a page edited on the 20th. A date
          # that lies is worse than no date, because Google reads it to decide
          # whether a re-crawl is worth its time.
          home=$(git log -1 --format=%cs -- index.html styles.css kiosk.js)
          imp=$(git log -1 --format=%cs -- impressum.html)
          # The namespace is an identifier, not a URL to fetch, and the sitemaps
          # protocol spells it with http. Writing https here is not a modernisation:
          # it is a different namespace, and a validator reads the document as not
          # being a sitemap at all. Do not "fix" the scheme.
          sm=http://www.sitemaps.org/schemas/sitemap/0.9
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo "<urlset xmlns=\"$sm\">"
            echo "  <url><loc>https://kaffeelisten.de/</loc><lastmod>$home</lastmod><changefreq>monthly</changefreq><priority>1.0</priority></url>"
            echo "  <url><loc>https://kaffeelisten.de/impressum.html</loc><lastmod>$imp</lastmod><changefreq>yearly</changefreq><priority>0.3</priority></url>"
            echo '</urlset>'
          } > _site/sitemap.xml
          cat _site/sitemap.xml


      - name: Check what the site cannot be published without
        run: |
          # Pages a visitor reaches, and the files that make the site findable.
          # Both have been silently missing before.
          for f in index.html impressum.html 404.html styles.css kiosk.js                    robots.txt sitemap.xml llms.txt; do
            test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # .nojekyll is EMPTY by design - it exists to switch Jekyll off, and
          # `test -s` is false for an empty file. Checking it the same way as
          # the others failed the deploy on the first run of this guard.
          test -f _site/.nojekyll || { echo "missing: .nojekyll"; exit 1; }
          test -d _site/assets || { echo "missing from the published site: assets/"; exit 1; }
          # Repository furniture must NOT ship.
          for f in README.md .github docs; do
            test -e "_site/$f" && { echo "should not be published: $f"; exit 1; } || true
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
